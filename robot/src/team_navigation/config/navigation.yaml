/**:
  ros__parameters:
    # A suggested development setting, not permission to move the car.
    requested_forward_speed_m_s: 0.25

    # Steering. 'taut': aim at the farthest point of the traced path that can
    # be reached in a straight line on the road and off no-go (ignores bends
    # in the path, uses the road's width in turns); falls back to 'center'
    # when that point is nearer than lookahead_m. 'center': aim at the path
    # point lookahead_m ahead.
    steering: taut
    # Yellow support (0..1, see vision.floor_fields) the straight line must
    # keep: higher stays further from the road's edges, lower cuts corners.
    taut_min_support: 0.5
    # Minimum aim distance (metres); the only aim distance for 'center'.
    lookahead_m: 0.20
    max_yaw_rate_rad_s: 1.0
    # Fewer visible trail points than this counts as "path lost" -> stop.
    min_trail_points: 3

    # Ignore camera frames older than this (seconds).
    max_image_age_s: 0.3

    # Vision. image_scale resizes frames before masking (0.25: 1280x720 -> 320x180).
    # OpenCV HSV ranges: H 0-179, S 0-255, V 0-255.
    image_scale: 0.25
    # V min 140: under the lab lighting the wall has the paper's hue and
    # saturation but is darker (paper V ~205, wall V ~96).
    yellow_hsv_low: [18, 120, 140]
    yellow_hsv_high: [35, 255, 255]
    # Blue paper is no-go: a path never touches it.
    blue_hsv_low: [95, 60, 40]
    blue_hsv_high: [130, 255, 255]
    # Other cars (light grey body: any hue, low S, bright) are no-go too.
    car_hsv_low: [0, 0, 150]
    car_hsv_high: [179, 80, 255]

    # Path estimation (vision.trace_paths). Sizes are in pixels at image_scale
    # as seen at the BOTTOM row; they shrink automatically with distance.
    # Row where the floor would vanish, as a fraction of image height (0 = top).
    horizon_frac: 0.28
    # Widest stretch of non-yellow, non-blue floor a path may cross.
    max_gap_px: 120.0
    # Clearance kept from blue and from other cars.
    blue_margin_px: 6.0
    car_margin_px: 15.0
    # Pull towards blue so turns round it are tight (0.0 = none).
    blue_hug_gain: 0.3
    # Price of moving sideways: higher = straighter paths, lower = follows
    # the middle of the yellow more closely.
    turn_cost: 0.15

    # 3x3 pixel -> floor homography in row order, from geometry.compute_homography.
    # Pixels must be at image_scale resolution. Write every entry as a float
    # (e.g. 1.0, not 1). All zeros = not calibrated -> zero motion.
    # TEMPORARY rough value for checking steering direction only (bottom of
    # image ~0.1 m ahead, top ~0.64 m, image centre straight ahead). Replace
    # with the tape-mark calibration before driving.
    homography: [0.0, -0.003, 0.64, -0.003, 0.0, 0.48, 0.0, 0.0, 1.0]

    # Publish navigation/debug_image (mask + trail + target) for RViz.
    publish_debug_image: true
