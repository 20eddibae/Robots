/**:
  ros__parameters:
    # Forward speed for each gamepad profile (Y button), [Low, Medium, High].
    # The safety node caps each profile's treads at Low 0.15, Medium 0.60,
    # High 1.40 m/s, so Medium's 0.75 actually drives at 0.60.
    profile_speeds_m_s: [0.15, 0.75, 0.8]
    # Overall cap on top of that. Launch with speed:=0.3 to cap a run lower.
    requested_forward_speed_m_s: 1.4

    # ---- Mode switches. Override for one run without editing this file:
    #   ros2 launch team_navigation team.launch.py namespace:="$ROBOT_NAMESPACE" \
    #       perception:=blue_aware footprint_check:=true speed:=0.25
    # perception: 'yellow' = the best-path branch's yellow-only tracing
    # (ignores blue and cars). 'blue_aware' = yellow road with blue and other
    # cars as no-go, both ways round a split (the settings further down).
    perception: yellow
    # blue_aware only: keep both treads off blue/cars (robot_half_width_px)
    # and stop with BLOCKED (treads) when they cannot get past just ahead.
    footprint_check: false

    # Steering. 'taut': aim at the farthest point of the traced path that can
    # be reached in a straight line inside the road (ignores bends in the
    # path, uses the road's width in turns); falls back to 'center' when that
    # point is nearer than lookahead_m. 'center': aim at the path point
    # lookahead_m ahead.
    steering: taut
    # perception: yellow -- keep the straight line this fraction of the
    # path's width from each edge.
    edge_margin_frac: 0.15
    # perception: blue_aware -- fraction (0..1) of the robot's width, tread to tread, that must be on
    # yellow all along the straight line (see vision.footprint_support):
    # higher keeps the treads further inside the road, lower cuts corners.
    taut_min_support: 0.75
    # Minimum aim distance (metres); the only aim distance for 'center'.
    lookahead_m: 0.20
    # Turn-rate cap. Turns get wider as speed rises (radius >= speed / this):
    # 3.0 allows ~0.2 m radius at Medium, ~0.5 m at High.
    max_yaw_rate_rad_s: 3.0
    # Explore: with no usable path (NO PATH / PATH TOO SHORT / BLOCKED) and
    # blue covering at least explore_min_blue_frac of the floor in view, turn
    # on the spot clockwise (right) at explore_yaw_rate_rad_s until a path is
    # found; give up (stop) after explore_max_s. Both modes detect blue for this.
    explore_when_blocked: true
    explore_yaw_rate_rad_s: 0.5
    explore_min_blue_frac: 0.02
    explore_max_s: 15.0
    # Fewer visible trail points than this counts as "path lost" -> stop.
    min_trail_points: 3

    # Ignore camera frames older than this (seconds).
    max_image_age_s: 0.3

    # Vision. image_scale resizes frames before masking (0.25: 1280x720 -> 320x180).
    # OpenCV HSV ranges: H 0-179, S 0-255, V 0-255.
    image_scale: 0.25
    # V min 140: under the lab lighting the wall has the paper's hue and
    # saturation but is darker (paper V ~205, wall V ~96).
    # S min 60: pale sheets measure S ~70-110 (was 120, which missed them);
    # grey carpet is S < 35.
    yellow_hsv_low: [18, 60, 140]
    yellow_hsv_high: [35, 255, 255]
    # perception: yellow -- merge yellow groups closer than [sideways,
    # along-path] pixels (at image_scale) before tracing. [0, 0] = off.
    path_gap_px: [9, 25]
    # perception: yellow -- where the yellow ends, look up to this many rows
    # further (at the bottom row, fewer with distance) for the next sheet in
    # line with the trail and carry on along it. 0 = stop at every gap.
    path_jump_px: 80

    # ---- perception: blue_aware settings (ignored by 'yellow') ----
    # Blue paper is no-go: a path never touches it.
    blue_hsv_low: [95, 60, 40]
    blue_hsv_high: [130, 255, 255]
    # Other cars (light grey body: any hue, low S, bright) are no-go too.
    car_hsv_low: [0, 0, 150]
    car_hsv_high: [179, 80, 255]
    # Ignore blue blobs smaller than this (pixels at the bottom row, fewer
    # with distance): specks on carpet/tape, not paper. 0 = keep all.
    blue_min_area_px: 150.0

    # Path estimation (vision.trace_paths). Sizes are in pixels at image_scale
    # as seen at the BOTTOM row; they shrink automatically with distance.
    # Row where the floor would vanish, as a fraction of image height (0 = top).
    horizon_frac: 0.28
    # Widest stretch of non-yellow, non-blue floor a path may cross.
    max_gap_px: 180.0
    # Robot footprint: half the robot's width (22 cm / 2) in pixels at the
    # bottom row, shrinking with distance like the sizes above. Paths and the
    # taut line keep the robot's centre this far (+ the margins below) from
    # blue and cars, so neither tread touches them. ESTIMATE from holding arms
    # along the treads; measure with two sheets laid straight ahead (a letter
    # sheet is 21.6 cm wide, about the robot's width). 0.0 = treat the robot
    # as a point. Used only when footprint_check is true.
    robot_half_width_px: 150.0
    # The bottom fraction of the image where the footprint is not applied:
    # the robot is already there, and its treads are outside the image.
    footprint_skip_frac: 0.1
    # Rows the path must reach beyond that region; fewer means the treads
    # cannot get past blue/cars just ahead -> stop (viewer: BLOCKED (treads)).
    footprint_min_clear_rows: 10
    # Extra clearance kept from blue and from other cars, beyond the treads.
    blue_margin_px: 6.0
    car_margin_px: 15.0
    # Pull towards blue so turns round it are tight (0.0 = none).
    blue_hug_gain: 0.3
    # Price of moving sideways: higher = straighter paths, lower = follows
    # the middle of the yellow more closely.
    turn_cost: 0.15

    # 3x3 pixel -> floor homography in row order, from geometry.compute_homography.
    # Pixels must be at image_scale resolution. Write every entry as a float
    # (e.g. 1.0, not 1). All zeros = not calibrated -> zero motion.
    # TEMPORARY rough value for checking steering direction only (bottom of
    # image ~0.1 m ahead, top ~0.64 m, image centre straight ahead). Replace
    # with the tape-mark calibration before driving.
    homography: [0.0, -0.003, 0.64, -0.003, 0.0, 0.48, 0.0, 0.0, 1.0]

    # Publish navigation/debug_image (mask + trail + target) for RViz.
    publish_debug_image: true
